name: Playwright E2E – Single Test

on:
    pull_request:
        branches: [trunk] # run on every PR targeting the trunk branch
        types: [opened, edited, synchronize, reopened]
    workflow_dispatch: # allow manual runs and later test‑path changes
        inputs:
            test-path:
                description: |
                    Relative path (or glob/pattern) of the Playwright test(s) to execute.
                    The default points to a Playwright spec that exists in the repo.
                required: true
                default: test/e2e/specs/editor/blocks/paragraph.spec.js

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            # -----------------------------------------------------------------
            # 1️⃣ Checkout the repository
            # -----------------------------------------------------------------
            - name: Checkout repository
              uses: actions/checkout@v4

            # -----------------------------------------------------------------
            # 2️⃣ Set up Node (matches repository engines) and cache node_modules
            # -----------------------------------------------------------------
            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            # -----------------------------------------------------------------
            # 3️⃣ Install dependencies (clean, reproducible)
            # -----------------------------------------------------------------
            - name: Install npm dependencies
              run: npm ci

            # -----------------------------------------------------------------
            # 4️⃣ Start the WordPress test environment (Docker via wp‑env)
            # -----------------------------------------------------------------
            - name: Start wp‑env (Docker)
              run: npm run wp-env-test -- start
              # `wp-env-test` reads `.wp-env.test.json`, the CI‑ready config.

            # -----------------------------------------------------------------
            # 5️⃣ Find or create a status comment on the PR (single comment)
            # -----------------------------------------------------------------
            - name: Find or create status comment
              id: comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const marker = '<!-- e2e-test-comment:id -->';
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.payload.pull_request.number,
                      });
                      let comment = comments.find(c => c.body && c.body.includes(marker));
                      if (!comment) {
                        const { data: created } = await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.payload.pull_request.number,
                          body: `${marker}\n**E2E Test:** _pending…_\n\n_Comment created by automated workflow._`,
                        });
                        comment = created;
                      }
                      core.setOutput('comment_id', comment.id);

            # -----------------------------------------------------------------
            # 6️⃣ Extract test info from PR description (if any)
            # -----------------------------------------------------------------
            - name: Extract test info from PR body
              id: testinfo
              uses: actions/github-script@v7
              with:
                  script: |
                      const body = context.payload.pull_request?.body || '';
                      const pathMatch = body.match(/!Review[-_]E2E[-_]Test:\s*([^\s]+)/i);
                      const nameMatch = body.match(/!Review[-_]E2E[-_]Test[-_]Name:\s*([^\n\r]+)/i);
                      const testPath = pathMatch ? pathMatch[1].trim() : '';
                      const testGrep = nameMatch ? nameMatch[1].trim() : '';
                      core.setOutput('path', testPath);
                      core.setOutput('grep', testGrep);

            # -----------------------------------------------------------------
            # 7️⃣ Resolve final test path (PR overrides input)
            # -----------------------------------------------------------------
            - name: Resolve test path
              id: resolve
              run: |
                  TEST_PATH="${{ steps.testinfo.outputs.path }}"
                  if [ -z "$TEST_PATH" ]; then
                    TEST_PATH="${{ github.event.inputs.test-path }}"
                  fi
                  echo "test_path=$TEST_PATH" >> "$GITHUB_OUTPUT"
              shell: bash

            # -----------------------------------------------------------------
            # 8️⃣ Verify test file exists
            # -----------------------------------------------------------------
            - name: Check test file existence
              id: check_path
              run: |
                  if [ -f "${{ steps.resolve.outputs.test_path }}" ]; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi
              shell: bash

            # -----------------------------------------------------------------
            # 9️⃣ Resolve optional test‑name pattern
            # -----------------------------------------------------------------
            - name: Resolve test name pattern
              id: resolve-name
              run: |
                  echo "test_grep=${{ steps.testinfo.outputs.grep }}" >> "$GITHUB_OUTPUT"
              shell: bash

            # -----------------------------------------------------------------
            # 🔟 Run the selected Playwright test (Chromium only) – only if file exists
            # -----------------------------------------------------------------
            - name: Run Playwright test
              if: steps.check_path.outputs.exists == 'true'
              env:
                  PLAYWRIGHT_VIDEO: on # record video for every test
              run: |
                  TEST_PATH="${{ steps.resolve.outputs.test_path }}"
                  TEST_GREP="${{ steps.resolve-name.outputs.test_grep }}"

                  CMD=( npx wp-scripts test-playwright \
                    --config test/e2e/playwright.config.ts \
                    "$TEST_PATH" \
                    --project=chromium \
                    --reporter html \
                    --output=playwright-report )

                  if [ -n "$TEST_GREP" ]; then
                    CMD+=( -g "$TEST_GREP" )
                  fi

                  "${CMD[@]}"

            # -----------------------------------------------------------------
            # 1️⃣1️⃣ Update comment on test success
            # -----------------------------------------------------------------
            - name: Update comment on success
              if: success()
              uses: actions/github-script@v7
              with:
                  script: |
                      const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
                      const body = `<!-- e2e-test-comment:id -->\n**E2E Test:** ✅ _passed_\n\n[View artifacts](${runUrl})\n\n_Automated by the Playwright workflow._`;
                      await github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: ${{ steps.comment.outputs.comment_id }},
                        body,
                      });

            # -----------------------------------------------------------------
            # 1️⃣2️⃣ Update comment on test failure (or missing file)
            # -----------------------------------------------------------------
            - name: Update comment on failure or missing file
              if: failure() || steps.check_path.outputs.exists == 'false'
              uses: actions/github-script@v7
              with:
                  script: |
                      const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
                      let status = '❌ _failed_';
                      if ("${{ steps.check_path.outputs.exists }}" === 'false') {
                        status = '⚠️ _test file not found_';
                      }
                      const body = `<!-- e2e-test-comment:id -->\n**E2E Test:** ${status}\n\n[View run details](${runUrl})\n\n_Automated by the Playwright workflow._`;
                      await github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: ${{ steps.comment.outputs.comment_id }},
                        body,
                      });

            # -----------------------------------------------------------------
            # 1️⃣3️⃣ Upload Playwright artifacts (always)
            # -----------------------------------------------------------------
            - name: Upload Playwright artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-artifacts
                  path: |
                      playwright-report/**   # HTML report (links to videos/traces)
                      test-results/**        # Default Playwright output folder (videos, screenshots, traces)
